<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}undercover{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --border: #2a2f45;
      --text: #e4e6f0;
      --muted: #9aa0b8;
      --accent: #6d8bff;
      --low: #3aa76d;
      --medium: #d6a234;
      --high: #e07a3f;
      --critical: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }
    header .brand { font-weight: 700; letter-spacing: 0.02em; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }
    header nav a:hover, header nav a.active { color: var(--text); }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    a { color: var(--accent); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #0f1220;
    }
    .badge.low { background: var(--low); }
    .badge.medium { background: var(--medium); }
    .badge.high { background: var(--high); }
    .badge.critical { background: var(--critical); color: white; }
    .badge.status { background: var(--border); color: var(--text); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .stat .value { font-size: 26px; font-weight: 700; }
    .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
    .bar-label { width: 110px; flex-shrink: 0; color: var(--muted); }
    .bar-track { flex: 1; background: var(--border); border-radius: 4px; overflow: hidden; height: 14px; }
    .bar-fill { height: 100%; background: var(--accent); }
    .bar-count { width: 40px; text-align: right; flex-shrink: 0; }
    .filters { margin-bottom: 16px; font-size: 13px; }
    .filters a { margin-right: 12px; color: var(--muted); text-decoration: none; }
    .filters a.active { color: var(--accent); font-weight: 600; }
    .factor-detail { color: var(--muted); font-size: 13px; }
    .status-form { display: inline; margin-right: 8px; }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .empty { color: var(--muted); padding: 20px 0; }
  </style>
</head>
<body>
  <header>
    <div class="brand">undercover</div>
    <nav>
      <a href="/ui/dashboard" class="{% if active == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/ui/cases" class="{% if active == 'cases' %}active{% endif %}">Cases</a>
      <a href="/docs">API docs</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
