[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "undercover"
version = "0.1.0"
description = "A data-loss-prevention and phishing-detection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "undercover contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
ner = ["spacy>=3.7"]
phishing = ["scikit-learn>=1.3", "joblib>=1.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "httpx>=0.27"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
undercover = "undercover.cli:main"
undercover-phish = "undercover.phishing.cli:main"
undercover-phish-train = "undercover.phishing.train_cli:main"
undercover-api = "undercover.api.serve_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"undercover.phishing" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
